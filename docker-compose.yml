version: '3.8'

services:
  # 1. REDIS - Message Broker
  redis:
    image: redis:alpine
    container_name: redis-broker
    restart: always
    ports:
      - "6379:6379"

  # 2. FASTAPI WEB SERVICE
  web:
    build: .
    container_name: fastapi-web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: uvicorn project.main:app --host 0.0.0.0 --port 8000

  # 3. CELERY WORKER
  worker:
    build: .
    container_name: celery-worker
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A project.worker.celery worker --concurrency=3 --loglevel=info
